<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 120">
  <defs>
    <mask id="crescent-right">
      <rect width="120" height="120" fill="#000"></rect>
      <circle cx="60" cy="60" r="45" fill="#fff"></circle>
      <circle cx="37" cy="55" r="45" fill="#000"></circle>
    </mask>
    <style>
      .word {
        fill: currentColor;
        font-family: "Montserrat", Inter, Arial, Helvetica, sans-serif;
        font-weight: 700;
        font-size: 56px;
        letter-spacing: 4px;
        dominant-baseline: alphabetic;
      }
    </style>
  </defs>

  <!-- Moon -->
  <g transform="translate(10,0) scale(0.85) rotate(12 60 60)">
    <rect width="120" height="120" fill="currentColor" mask="url(#crescent-right)"></rect>
  </g>

  <!-- Words with extra spacing -->
  <text class="word" x="120" y="78">Darkmoon</text>
  <text class="word" x="460" y="78">SATIN</text>
</svg>
